# VPN overlay: compose with the base file to route crawler traffic through gluetun.
#
#   docker compose -f docker-compose.yml -f docker-compose.vpn.yml run --rm crawler python crawler.py ...
#
# .env contains WIREGUARD_CONFIG_PATH, an absolute path to your private .conf.
# The file selects a fixed endpoint. Keep it outside the repository and use the
# same endpoint for all conditions in an experiment. See make preflight-vpn.

services:
  gluetun:
    image: qmcgaw/gluetun@sha256:cbafe0945d0fe5a3c55ca64d43a85c5db270458f4c645ee65797b527f6f57a64
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      # Filtering belongs to the experimental browser extensions, not the VPN.
      BLOCK_ADS: "off"
      BLOCK_SURVEILLANCE: "off"
      BLOCK_MALICIOUS: "off"
    volumes:
      - type: bind
        source: ${WIREGUARD_CONFIG_PATH:?Set WIREGUARD_CONFIG_PATH in .env}
        target: /gluetun/wireguard/wg0.conf
        read_only: true
        bind:
          create_host_path: false
    # No FIREWALL_OUTBOUND_SUBNETS on purpose: crawled pages must not reach the LAN.
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  crawler:
    # Route ALL crawler traffic through gluetun (no direct internet access).
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
